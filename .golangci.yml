version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    errcheck:
      # Исключение по статическому типу получателя: только Close у значений типа
      # io.ReadCloser (тела HTTP-ответов/запросов — resp.Body, r.Body и т.п.).
      # io.WriteCloser, *os.File и прочие Close под исключение не попадают.
      # Что конкретный writer за интерфейсом проверен — правило не гарантирует.
      exclude-functions:
        - (io.ReadCloser).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
